version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scholarpass_db
    environment:
      POSTGRES_USER: scholarpass_user
      POSTGRES_PASSWORD: scholarpass_password
      POSTGRES_DB: scholarpass_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarpass_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarpass_network

  redis:
    image: redis:7-alpine
    container_name: scholarpass_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarpass_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarpass_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://scholarpass_user:scholarpass_password@db:5432/scholarpass_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - ENVIRONMENT=development
      - DB_AUTO_MIGRATE=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scholarpass_network

volumes:
  postgres_data:
  redis_data:

networks:
  scholarpass_network:
    driver: bridge
